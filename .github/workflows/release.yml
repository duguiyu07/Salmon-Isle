name: Release website
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Validate release version
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: node scripts/check-release-version.mjs
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:standalone
  website:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish versioned website
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --build-arg SALMON_RELEASE_REPOSITORY="$GITHUB_REPOSITORY" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$image:$version" .
          docker push "$image:$version"
  release:
    needs: website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm run release:deployment
      - run: npm run release:metadata
      - name: Upload draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          base=dist/deployment/public
          set -- "$base/Salmon-Isle-Source-$version.zip" "$base/Salmon-Isle-Server-$version.tar.gz" "$base/release.json" "$base/SHA256SUMS.txt" "$base/Salmon-Isle-Upgrade-2.2.zh-CN.md" "$base/source-package-report.json"
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release upload "v$version" "$@" --clobber
          else
            gh release create "v$version" "$@" --title "Salmon Isle $version" --draft --notes-file docs/release-2.2.1.zh-CN.md
          fi
  publish:
    needs: [verify, website, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --tag "$image:latest" "$image:$version"
          gh release edit "v$version" --draft=false --latest
