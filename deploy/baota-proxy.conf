# Put this fragment INSIDE the existing salmon-isle.com server block.
# Keep Baota's listen/SSL/certificate/ACME configuration. Do not add another server block.
# Remove the old WordPress rewrite/PHP routing and static-extension locations first.
client_max_body_size 310m;

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_cache off;
}
